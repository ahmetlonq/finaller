<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGS Deneme - Eğitim Psikolojisi (Tam Sürüm)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            padding: 20px 10px; 
            background-color: #e5e7eb;
            color: #1f2937; 
            display: flex; 
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .quiz-card {
            background: #ffffff;
            width: 100%;
            max-width: 700px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 95vh;
        }

        .quiz-header {
            background: #f8fafc;
            padding: 20px;
            border-bottom: 2px solid #e2e8f0;
            flex-shrink: 0;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .q-counter {
            font-size: 15px;
            font-weight: 700;
            color: #3b82f6;
            background: #eff6ff;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .score-badges {
            display: flex;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .badge-correct { color: #16a34a; background: #dcfce7; padding: 6px 10px; border-radius: 6px; }
        .badge-wrong { color: #dc2626; background: #fee2e2; padding: 6px 10px; border-radius: 6px; }
        
        .progress-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: #3b82f6; border-radius: 3px; width: 0%; transition: 0.3s; }

        .quiz-body {
            padding: 30px 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #111827;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.4;
        }
        .option-btn:hover:not(:disabled) { border-color: #cbd5e1; background: #f8fafc; }
        
        .option-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; font-weight: 700; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; font-weight: 700; }
        .option-btn:disabled { cursor: default; opacity: 0.9; }

        .quiz-footer {
            background: #f8fafc;
            padding: 20px;
            border-top: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
        }
        .nav-btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-prev { background: #e2e8f0; color: #475569; }
        .btn-prev:hover:not(:disabled) { background: #cbd5e1; }
        
        .btn-check { background: #f59e0b; color: white; flex: 1.2; }
        .btn-check:hover:not(:disabled) { background: #d97706; }
        
        .btn-next { background: #3b82f6; color: white; flex: 1.2; }
        .btn-next:hover:not(:disabled) { background: #2563eb; }
        
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #result-screen { display: none; text-align: center; padding: 50px 20px; flex-grow: 1; justify-content: center; flex-direction: column; }
        .result-circle { width: 100px; height: 100px; background: #eff6ff; border: 4px solid #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #1d4ed8; margin: 0 auto 20px auto; }
    </style>
</head>
<body>

    <div class="quiz-card" id="quiz-card">
        
        <div class="quiz-header" id="header-area">
            <div class="stats-row">
                <div class="q-counter" id="question-counter">Soru: 1 / 75</div>
                <div class="score-badges">
                    <div class="badge-correct" id="correct-text">Doğru: 0</div>

                </div>
            </div>
            <div class="progress-bg"><div class="progress-fill" id="progress-bar"></div></div>
        </div>

        <div class="quiz-body" id="quiz-area">
            <div class="question-text" id="question-text">Soru yükleniyor...</div>
            <div class="options-container" id="options-container"></div>
        </div>

        <div class="quiz-footer" id="footer-area">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="prevQuestion()">◂ Geri</button>
            <button class="nav-btn btn-check" id="btn-check" onclick="showAnswer()">👁️ Pas Geç / Cevabı Gör</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="nextQuestion()">İleri ➔</button>
        </div>

        <div id="result-screen">
            <h2 style="margin-top:0; color:#111827;">Sınav Tamamlandı!</h2>
            <div class="result-circle" id="score-result">0/75</div>
            <p style="color:#4b5563; font-size:16px;">Performans analiziniz kaydedildi. Final denemesini başarıyla bitirdiniz!</p>
            <button class="nav-btn btn-next" style="width: 100%; margin-top: 20px; padding: 18px;" onclick="location.href='index.html'">⌂ Ana Ekrana Dön</button>
        </div>

    </div>

        // Sistem Ayarları
        quizData.forEach(q => { q.userAnswer = null; });

        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;

        const qText = document.getElementById("question-text");
        const optContainer = document.getElementById("options-container");
        const btnPrev = document.getElementById("btn-prev");
        const btnCheck = document.getElementById("btn-check");
        const btnNext = document.getElementById("btn-next");

        function loadQuestion() {
            const q = quizData[currentIndex];
            
            // Sayaçları ve Barı Güncelle
            document.getElementById("question-counter").innerText = `Soru: ${currentIndex + 1} / ${quizData.length}`;
            document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            document.getElementById("correct-text").innerText = `Doğru: ${correctCount}`;
            document.getElementById("wrong-text").innerText = `Yanlış: ${wrongCount}`;

            // Metni ve Şıkları Ekrana Bas
            qText.innerText = q.question;
            optContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                
                if (q.userAnswer !== null) {
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.classList.add("correct"); 
                    } else if (index === q.userAnswer && q.userAnswer !== -1) {
                        btn.classList.add("wrong"); 
                    }
                } else {
                    btn.onclick = () => selectOption(index);
                }
                optContainer.appendChild(btn);
            });

            // Butonların durumları
            btnPrev.disabled = currentIndex === 0; 
            
            if (q.userAnswer !== null) {
                btnCheck.disabled = true;
                btnNext.disabled = false;
                btnNext.innerText = (currentIndex === quizData.length - 1) ? "Bitir ✓" : "İleri ➔";
            } else {
                btnCheck.disabled = false;
                btnNext.disabled = true; 
                btnNext.innerText = "İleri ➔";
            }
            
            // Ekranı hep yukarı kaydır (uzun sorularda kullanıcı aşağıda kalmasın)
            document.getElementById("quiz-area").scrollTop = 0;
        }

        function selectOption(index) {
            const q = quizData[currentIndex];
            if (q.userAnswer !== null) return; 
            
            q.userAnswer = index; 
            
            if (index === q.correct) {
                correctCount++;
            } else {
                wrongCount++;
            }

            loadQuestion(); 
        }

        function showAnswer() {
            const q = quizData[currentIndex];
            if (q.userAnswer !== null) return;
            
            q.userAnswer = -1; // Pas geçti kodu
            wrongCount++; 
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function finishQuiz() {
            document.getElementById("header-area").style.display = "none";
            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("footer-area").style.display = "none";
            
            document.getElementById("result-screen").style.display = "flex";
            document.getElementById("score-result").innerText = `${correctCount}/${quizData.length}`;
        }

        loadQuestion();
    </script>
