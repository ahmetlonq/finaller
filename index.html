<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGS Hazırlık - Eğitim Psikolojisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            padding: 0; 
            /* Arka plana şık bir mobil gradyan ekledik */
            background: linear-gradient(135deg, #eff6ff 0%, #bfdbfe 100%); 
            color: #1f2937; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .welcome-card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
            color: #2563eb;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #111827;
        }

        p {
            margin: 0 0 30px 0;
            font-size: 15px;
            color: #4b5563;
            line-height: 1.6;
        }

        .info-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .badge {
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .start-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .start-btn:hover {
            background: #2563eb;
        }
        
        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="icon-wrapper">🧠</div>
        <h1>Eğitim Psikolojisi</h1>
        <p>26 Temmuz'daki Akademi Giriş Sınavı (AGS) öncesi eğitim bilimleri temelini test et. BÖTE ve pedagojik formasyon final soruları ile mobil denemeye başla.</p>
        
        <div class="info-badges">
            <div class="badge">📝 Özgün Sorular</div>
            <div class="badge">⚡ Hızlı Çözüm</div>
        </div>

        <a href="psikoloji_testi.html" class="start-btn">Sınava Başla ➔</a>
    </div>
    
    <div class="footer-text">Akademik Değerlendirme Modülü</div>

</body>
</html>
