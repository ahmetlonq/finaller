<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İşlem Soruları</title>
    <script src="islem_sorular.js"></script>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; text-align: left; font-size: 16px; }
        .correct { background: #dcfce7 !important; border-color: #22c55e !important; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="q">Yükleniyor...</h2>
        <div id="opts"></div>
        <button class="btn" onclick="location.href='olcme_menu.html'">◂ Menüye Dön</button>
    </div>

    <script>
        // Dosya yükleme kontrolünü basitleştirdik. 
        // Eğer değişken yine tanımsızsa console'a hata yazsın ama "bulunamadı" diye kullanıcıyı kovmasın.
        
        function baslat() {
            if (typeof islemQuizData === 'undefined') {
                document.getElementById('q').innerText = "Soru dosyası bekleniyor... Sayfayı yenile.";
                setTimeout(baslat, 500); // 0.5 saniye bekle tekrar dene
                return;
            }

            let cur = 0;
            const qEl = document.getElementById('q');
            const oEl = document.getElementById('opts');

            function load() {
                const q = islemQuizData[cur];
                qEl.innerText = q.question;
                oEl.innerHTML = '';
                q.options.forEach((o, i) => {
                    const b = document.createElement('button');
                    b.className = 'btn';
                    b.innerText = o;
                    b.onclick = () => {
                        if(i === q.correct) b.classList.add('correct');
                        else b.classList.add('wrong');
                        
                        setTimeout(() => {
                            cur++;
                            if(cur < islemQuizData.length) load();
                            else { alert('Tebrikler! İşlem soruları bitti.'); location.href='olcme_menu.html'; }
                        }, 500);
                    };
                    oEl.appendChild(b);
                });
            }
            load();
        }
        
        // Hemen çalıştır
        baslat();
    </script>
</body>
</html>
